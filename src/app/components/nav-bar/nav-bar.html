<nav
    data-aos="fade-down"
    data-aos-duration="800"
    data-aos-once="true"
    class="fixed top-0 left-0 right-0 z-[10000] bg-white/95 backdrop-blur-md shadow-lg px-4 py-3 flex justify-between items-center"
>
    <!-- Logo -->
    <div>
        <a href="#">
            <div class="flex items-center gap-3">
                <img [src]="image.logo" alt="MonCabinetDigital" class="rounded-full h-10 w-10 md:h-12 md:w-12">
                <h1 class="text-lg md:text-xl bg-gradient-to-r from-[#061A33] via-[#12365C] to-[#D4AF37] bg-clip-text text-transparent font-bold">
                    MonCabinetDigital
                </h1>
            </div>
        </a>
    </div>

    <!-- Menu desktop -->
    <div class="hidden lg:block">
        <ul class="flex items-center gap-6 text-sm font-medium text-[#061A33]">
            <li><a href="#" class="hover:text-[#C9A227] transition-colors">Accueil</a></li>
            <li><a href="#a-propos" class="hover:text-[#C9A227] transition-colors">À propos</a></li>
            <li><a href="#cabinet" class="hover:text-[#C9A227] transition-colors">Le Cabinet</a></li>
            <li><a href="#solution" class="hover:text-[#C9A227] transition-colors">Nos Solutions</a></li>
            <li><a href="#actualite" class="hover:text-[#C9A227] transition-colors">Actualités</a></li>
            <li><a href="#contact" class="hover:text-[#C9A227] transition-colors">Contacts</a></li>
        </ul>
    </div>

    <!-- Burger mobile -->
    <button
        (click)="menuOpen = true"
        class="lg:hidden w-11 h-11 flex items-center justify-center rounded-xl text-[#061A33] hover:bg-[#061A33]/5 transition-all"
        aria-label="Ouvrir le menu"
    >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
    </button>
</nav>

<!-- Espace réservé sous la navbar -->
<div class="h-[68px] md:h-[72px]"></div>

<!-- Overlay -->
<div
    *ngIf="menuOpen"
    (click)="menuOpen = false"
    class="fixed inset-0 z-[10001] bg-[#061A33]/50 backdrop-blur-sm lg:hidden"
></div>

<!-- Drawer -->
<aside
    [class.translate-x-0]="menuOpen"
    [class.translate-x-full]="!menuOpen"
    class="fixed top-0 right-0 z-[10002] h-screen w-[85%] max-w-sm bg-white shadow-2xl transform transition-transform duration-300 ease-out lg:hidden"
>
    <!-- Croix -->
    <button
        (click)="menuOpen = false"
        class="absolute top-4 right-4 z-10 w-10 h-10 flex items-center justify-center rounded-xl text-[#061A33] hover:bg-gray-100 transition-all"
        aria-label="Fermer le menu"
    >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6L6 18"/>
        </svg>
    </button>

    <div class="h-full flex flex-col">
        <div class="p-5 pr-16 border-b border-gray-100">
            <h2 class="text-lg font-bold bg-gradient-to-r from-[#061A33] via-[#12365C] to-[#D4AF37] bg-clip-text text-transparent">
                MonCabinetDigital
            </h2>
        </div>

        <div class="flex-1 overflow-y-auto p-5">
            <ul class="space-y-1">
                <li>
                    <a
                        (click)="menuOpen = false"
                        href="#"
                        class="block px-4 py-3.5 rounded-xl text-[#061A33] font-medium hover:bg-[#061A33]/5 hover:text-[#C9A227] transition-all"
                    >
                        Accueil
                    </a>
                </li>

                <li>
                    <a
                        (click)="menuOpen = false"
                        href="#a-propos"
                        class="block px-4 py-3.5 rounded-xl text-[#061A33] font-medium hover:bg-[#061A33]/5 hover:text-[#C9A227] transition-all"
                    >
                        À propos
                    </a>
                </li>

                <li>
                    <a
                        (click)="menuOpen = false"
                        href="#cabinet"
                        class="block px-4 py-3.5 rounded-xl text-[#061A33] font-medium hover:bg-[#061A33]/5 hover:text-[#C9A227] transition-all"
                    >
                        Le Cabinet
                    </a>
                </li>

                <li>
                    <a
                        (click)="menuOpen = false"
                        href="#solution"
                        class="block px-4 py-3.5 rounded-xl text-[#061A33] font-medium hover:bg-[#061A33]/5 hover:text-[#C9A227] transition-all"
                    >
                        Nos Solutions
                    </a>
                </li>

                <li>
                    <a
                        (click)="menuOpen = false"
                        href="#actualite"
                        class="block px-4 py-3.5 rounded-xl text-[#061A33] font-medium hover:bg-[#061A33]/5 hover:text-[#C9A227] transition-all"
                    >
                        Actualités
                    </a>
                </li>

                <li>
                    <a
                        (click)="menuOpen = false"
                        href="#contact"
                        class="block px-4 py-3.5 rounded-xl text-[#061A33] font-medium hover:bg-[#061A33]/5 hover:text-[#C9A227] transition-all"
                    >
                        Contacts
                    </a>
                </li>
            </ul>
        </div>

        <div class="p-5 border-t border-gray-100">
            <a
                routerLink=""
                class="block text-center py-3.5 rounded-xl bg-gradient-to-r from-[#061A33] to-[#12365C] text-white font-semibold shadow-lg hover:shadow-xl transition-all"
            >
                Découvrir
            </a>
        </div>
    </div>
</aside>
